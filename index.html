<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Daromad va xarajatlarni boshqarish uchun oddiy buxgalteriya dasturi"><title>Accounting Project — Buxgalteriya</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><header><div><p class="eyebrow">BUXGALTERIYA</p><h1>Accounting Project</h1><p class="subtitle">Daromad va xarajatlaringizni bir joyda boshqaring.</p></div><button id="clearAll" class="secondary">Barchasini tozalash</button></header>
<section class="cards"><article><span>Jami daromad</span><strong id="income">0 so‘m</strong></article><article><span>Jami xarajat</span><strong id="expense">0 so‘m</strong></article><article><span>Balans</span><strong id="balance">0 so‘m</strong></article></section>
<section class="panel"><h2>Yangi operatsiya</h2><div class="form"><label>Nomi<input id="description" maxlength="80" placeholder="Masalan: xizmat uchun to‘lov"></label><label>Summa<input id="amount" type="number" min="0.01" step="0.01" placeholder="0"></label><label>Turi<select id="type"><option value="income">Daromad</option><option value="expense">Xarajat</option></select></label><button id="add">Qo‘shish</button></div><p id="message" class="message" role="status"></p></section>
<section class="panel"><div class="table-head"><h2>Operatsiyalar</h2><span id="count">0 ta</span></div><div class="table-wrap"><table><thead><tr><th>Sana</th><th>Nomi</th><th>Turi</th><th>Summa</th><th></th></tr></thead><tbody id="transactions"></tbody></table></div><p id="empty" class="empty">Hozircha operatsiyalar yo‘q.</p></section><footer>Ma’lumotlar shu brauzeringizda saqlanadi.</footer></main><script src="app.js"></script></body></html>
